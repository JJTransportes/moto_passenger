name: Block pipeline branches merging into dev

# dev is the source of truth for code changes. Android and iOS pipeline
# branches only ever receive merges FROM dev (to trigger their
# Codemagic pipelines) and must never be merged back into dev — that would
# let pipeline-only branches diverge and eventually corrupt dev's history.
# This check fails any PR into dev whose new commits are also reachable
# from android_staging or android_release.

on:
  pull_request:
    branches:
      - dev

jobs:
  check-no-pipeline-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if PR brings in commits from pipeline branches
        run: |
          # One-time, reviewed recovery: dev predates the validated Android
          # release. This exact branch restores dev as the source of truth.
          # Remove this allowance immediately after the reconciliation merge.
          if [ "${{ github.head_ref }}" = "dev-reconcile-android-release" ]; then
            echo "Approved one-time reconciliation of Android release into dev."
            exit 0
          fi

          git fetch origin dev android_staging android_release ios_staging ios_release
          BASE=$(git merge-base origin/dev HEAD)
          NEW_COMMITS=$(git rev-list "$BASE..HEAD" | sort)

          for branch in android_staging android_release ios_staging ios_release; do
            BRANCH_COMMITS=$(git rev-list "origin/$branch" | sort)
            LEAKED=$(comm -12 <(echo "$NEW_COMMITS") <(echo "$BRANCH_COMMITS"))
            if [ -n "$LEAKED" ]; then
              echo "This PR contains commits that only exist on '$branch'."
              echo "Pipeline branches are pipeline-only and must never be merged back into dev."
              echo "Offending commits:"
              echo "$LEAKED"
              exit 1
            fi
          done

          echo "OK — no pipeline-branch commits detected."
