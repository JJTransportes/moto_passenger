workflows:
  android_staging:
    name: Moto - Passenger Staging
    max_build_duration: 30
    instance_type: mac_mini_m1

    triggering:
      events:
      - push
      branch_patterns:
      - pattern: "staging"
      - include: true
      - source: true
      cancel_previous_builds: true

    environment:
      flutter: 3.32.2
      groups:
      - moto_passenger_staging
      android_signing:
      - moto_passenger_keystore

    scripts:
    - name: Set up local.properties
      script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

    - name: Get Flutter packages
      script: flutter pub get

    - name: Config definitions
      script: |
        cat > .env << EOF
        API_BASE_URL=$API_BASE_URL
        EOF
    - name: Build App Bundle
      script: flutter build appbundle --release

    artifacts:
    - build/**/outputs/**/*.aab
    - build/**/outputs/**/mapping.txt
    - flutter_drive.log

    publishing:
      email:
        recipients:
        - comercialpepiviagens@gmail.com
        notify:
          success: false
          failure: true

      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha
        submit_as_draft: false

  ios_staging:
    name: Moto iOS Staging
    instance_type: mac_mini_m1
    max_build_duration: 30
    integrations:
      app_store_connect: Moto Driver

    triggering:
      events:
      - push
      branch_patterns:
      - pattern: "ios_staging"
      - include: true
      - source: true
      cancel_previous_builds: true

    environment:
      flutter: 3.32.2
      groups:
      - moto_passenger_staging
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $MOTO_PASSENGER_BUNDLE_ID

    scripts:
    - name: Set up code signing settings on Xcode project
      script: |
        xcode-project use-profiles
    - name: Get Flutter packages
      script: |
        flutter pub get
    - name: Install pods
      script: |
        find . -name "Podfile" -execdir pod install \;
    - name: Config definitions
      script: |
        cat > .env << EOF
        API_BASE_URL=$API_BASE_URL
        EOF
    - name: Flutter build ipa
      script: |
        flutter build ipa --release \
          --build-name=1.0.0 \
          --build-number=5 \
          --export-options-plist=/Users/builder/export_options.plist
    artifacts:
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - flutter_drive.log

    publishing:
      email:
        recipients:
        - comercialpepiviagens@gmail.com
        notify:
          success: false
          failure: true

      app_store_connect:
        auth: integration
        beta_groups:
        - Moto Passenger Staging
        submit_to_testflight: true
        submit_to_app_store: false
        issuer_id: $ISSUER_ID
