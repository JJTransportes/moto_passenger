workflows:
  android_release:
    name: Moto Passenger Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2

    triggering:
      events:
      - push
      branch_patterns:
      - pattern: "android_release"
      - include: true
      - source: true
      cancel_previous_builds: true

    environment:
      flutter: 3.44.0
      groups:
      - release
      android_signing:
      - moto_passenger_keystore

    scripts:
    - name: Set up local.properties
      script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

    - name: Get Flutter packages
      script: flutter pub get

    - name: Config definitions
      script: |
        cat > .env << EOF
        API_BASE_URL=$API_BASE_URL
        ONE_SIGNAL_ID=$ONE_SIGNAL_ID
        EOF

    - name: Run tests
      script: flutter test

    - name: Determine next build number
      script: |
        LATEST_BUILD_NUMBER=$(google-play get-latest-build-number \
          --package-name "br.com.rockservicos.moto_passenger" \
          --credentials "@env:GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS")
        NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
        echo "Latest build number across all tracks: $LATEST_BUILD_NUMBER"
        echo "Next build number: $NEW_BUILD_NUMBER"
        echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> $CM_ENV

    - name: Build App Bundle
      script: flutter build appbundle --release --build-number=$NEW_BUILD_NUMBER

    artifacts:
    - build/**/outputs/**/*.aab
    - build/**/outputs/**/mapping.txt
    - flutter_drive.log

    publishing:
      email:
        recipients:
        - dev.jr.s.engineer@gmail.com
        notify:
          success: false
          failure: true

      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false
