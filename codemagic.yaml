workflows:
  android_release:
    name: Moto Passenger Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2

    triggering:
      events: []
      # push trigger temporarily disabled while this pipeline is being reconstructed
      # in a working branch — re-add "- push" under events when ready to resume
      # automatic builds/publishing on android_release.
      branch_patterns:
      - pattern: "android_release"
      - include: true
      - source: true
      cancel_previous_builds: true

    environment:
      flutter: 3.44.0
      groups:
      - release
      android_signing:
      - moto_passenger_keystore

    cache:
      cache_paths:
      - $HOME/.pub-cache

    scripts:
    - name: Set up local.properties
      script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

    - name: Get Flutter packages
      script: flutter pub get

    - name: Config definitions
      script: |
        cat > .env << EOF
        API_BASE_URL=$API_BASE_URL
        ONE_SIGNAL_ID=$ONE_SIGNAL_ID
        EOF

    - name: Run tests
      script: flutter test

    - name: Determine next build number
      script: |
        LATEST_BUILD_NUMBER=$(google-play get-latest-build-number \
          --package-name "br.com.rockservicos.moto_passenger" \
          --credentials "@env:GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS")
        NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
        echo "Latest build number across all tracks: $LATEST_BUILD_NUMBER"
        echo "Next build number: $NEW_BUILD_NUMBER"
        echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> $CM_ENV

    - name: Build App Bundle
      script: flutter build appbundle --release --build-number=$NEW_BUILD_NUMBER --dart-define=FORCE_PLAY_UPDATE=true

    artifacts:
    - build/**/outputs/**/*.aab
    - build/**/outputs/**/mapping.txt
    - flutter_drive.log

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false

  ios_staging:
    name: Moto Passenger iOS Staging
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Moto Passenger
    triggering:
      # Manual until Apple completes the organization migration and signing setup.
      events: []
      branch_patterns:
      - pattern: "ios_staging"
        include: true
        source: true
      cancel_previous_builds: true
    environment:
      flutter: 3.44.0
      groups:
      - moto_passenger_staging
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.rockservicos.motoPassengerApp
    cache:
      cache_paths:
      - $HOME/.pub-cache
    scripts:
    - name: Set up code signing settings on Xcode project
      script: xcode-project use-profiles
    - name: Get Flutter packages
      script: flutter pub get
    - name: Run tests
      script: flutter test
    - name: Set application secrets
      script: |
        cat <<EOF > ios/Flutter/Secrets.xcconfig
        IOS_MAPS_API_KEY=$IOS_MAPS_API_KEY
        EOF
    - name: Install pods
      script: find . -name "Podfile" -execdir pod install \;
    - name: Configure runtime definitions
      script: |
        cat > .env << EOF
        API_BASE_URL=$API_BASE_URL
        ONE_SIGNAL_ID=$ONE_SIGNAL_ID
        EOF
    - name: Determine next TestFlight build number
      script: |
        LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
        NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
        echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> $CM_ENV
    - name: Build IPA
      script: flutter build ipa --release --build-number=$NEW_BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        beta_groups:
        - Moto Passenger Staging
        submit_to_testflight: true
        submit_to_app_store: false
        issuer_id: $ISSUER_ID

  ios_release:
    name: Moto Passenger iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Moto Passenger
    triggering:
      events: []
      branch_patterns:
      - pattern: "ios_release"
        include: true
        source: true
      cancel_previous_builds: true
    environment:
      flutter: 3.44.0
      groups:
      - release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.rockservicos.motoPassengerApp
    cache:
      cache_paths:
      - $HOME/.pub-cache
    scripts:
    - name: Set up code signing settings on Xcode project
      script: xcode-project use-profiles
    - name: Get Flutter packages
      script: flutter pub get
    - name: Run tests
      script: flutter test
    - name: Set application secrets
      script: |
        cat <<EOF > ios/Flutter/Secrets.xcconfig
        IOS_MAPS_API_KEY=$IOS_MAPS_API_KEY
        EOF
    - name: Install pods
      script: find . -name "Podfile" -execdir pod install \;
    - name: Configure runtime definitions
      script: |
        cat > .env << EOF
        API_BASE_URL=$API_BASE_URL
        ONE_SIGNAL_ID=$ONE_SIGNAL_ID
        EOF
    - name: Determine next TestFlight build number
      script: |
        LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
        NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
        echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> $CM_ENV
    - name: Build IPA
      script: flutter build ipa --release --build-number=$NEW_BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        beta_groups:
        - Moto Passenger Release
        submit_to_testflight: true
        submit_to_app_store: false
        issuer_id: $ISSUER_ID
