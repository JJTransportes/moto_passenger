workflows:
  ios_pre_release:
    name: Moto Passenger iOS Pre Release
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Moto Driver

    triggering:
      events:
      - push
      branch_patterns:
      - pattern: "ios_pre_release"
      - include: true
      - source: true
      cancel_previous_builds: true

    environment:
      flutter: 3.32.2
      groups:
      - pre_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $MOTO_PASSENGER_BUNDLE_ID

    scripts:
    - name: Set up code signing settings on Xcode project
      script: |
        xcode-project use-profiles

    - name: Get Flutter packages
      script: |
        flutter pub get

    - name: Install pods
      script: |
        find . -name "Podfile" -execdir pod install \;

    - name: Set application secrets
      script: |
        cat <<EOF > ios/Flutter/Secrets.xcconfig
        IOS_MAPS_API_KEY=$IOS_MAPS_API_KEY
        EOF

    - name: Config definitions
      script: |
        cat > .env << EOF
        API_BASE_URL=$API_BASE_URL
        EOF

    - name: Flutter build ipa
      script: |
        flutter build ipa --release \
          --build-name=1.0.0 \
          --build-number=12 \
          --export-options-plist=/Users/builder/export_options.plist

    artifacts:
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - flutter_drive.log

    publishing:
      email:
        recipients:
        - dev.jr.s.engineer@gmail.com
        notify:
          success: false
          failure: true

      app_store_connect:
        auth: integration
        beta_groups:
        - Moto Passenger Pre Release
        submit_to_testflight: true
        submit_to_app_store: false
        issuer_id: $ISSUER_ID
