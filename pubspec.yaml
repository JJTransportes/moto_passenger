name: moto_passenger
description: "Moto Passenger app."
publish_to: 'none'
version: 1.0.0+16

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_modular: ^6.3.4
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  dio: ^5.7.0
  signalr_netcore: ^1.3.7
  result_dart: ^2.1.1
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.1
  path: ^1.9.0
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  google_fonts: ^6.2.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.0
  path_provider: ^2.1.0
  image_picker: ^1.0.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_android: "assets/images/moto_passenger_icon.png"
  image_path_ios: "assets/images/moto_passenger_icon.png"

flutter:
  uses-material-design: true
  assets:
  - assets/images/
  - ".env"
